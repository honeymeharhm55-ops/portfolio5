  <text x="310" y="165" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#38bdf8">UP TO 50% OFF</text>
  <rect x="310" y="180" width="90" height="24" rx="12" fill="#8b5cf6" />
  <text x="355" y="196" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">SHOP NOW</text>

  <!-- Product Grid Items Below Banner -->
  <rect x="110" y="240" width="115" height="75" rx="8" fill="#1a2444" />
  <rect x="125" y="255" width="40" height="40" rx="4" fill="#38bdf8" opacity="0.4" />
  <rect x="175" y="260" width="40" height="8" rx="2" fill="#94a3b8" />
