  <rect x="307" y="260" width="40" height="8" rx="2" fill="#94a3b8" />
  <rect x="307" y="275" width="25" height="8" rx="2" fill="#a855f7" />

  <rect x="375" y="240" width="115" height="75" rx="8" fill="#1a2444" />
  <rect x="390" y="255" width="40" height="40" rx="4" fill="#00d2ff" opacity="0.4" />
