<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1228" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24305c" />
      <stop offset="100%" stop-color="#141c38" />
    </linearGradient>
    <linearGradient id="goldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#p4Bg)" />

  <!-- Pedestal Base -->
  <ellipse cx="300" cy="330" rx="200" ry="30" fill="#151e3c" />
  <ellipse cx="300" cy="330" rx="140" ry="18" fill="#1e2a52" />

  <!-- 3D Packaging Box Left -->
  <polygon points="170,160 250,110 320,150 240,200" fill="#2d3b6e" stroke="url(#goldCyan)" stroke-width="1.5" />
  <polygon points="170,160 240,200 240,320 170,280" fill="#1b2446" stroke="url(#goldCyan)" stroke-width="1.5" />
  <polygon points="240,200 320,150 320,270 240,320" fill="#222e58" stroke="url(#goldCyan)" stroke-width="1.5" />

  <!-- Branding Label on Box Left -->
  <text x="280" y="235" font-family="'Poppins', sans-serif" font-size="14" font-weight="800" fill="#00d2ff" transform="skewY(-16) rotate(-8)">LUMEN</text>
  <line x1="255" y1="260" x2="305" y2="245" stroke="#a855f7" stroke-width="2" />

  <!-- Cylinder Bottle Packaging Right -->
  <ellipse cx="400" cy="190" rx="40" ry="14" fill="#3b4d82" stroke="url(#goldCyan)" stroke-width="1.5" />
  <rect x="360" y="190" width="80" height="110" fill="#283560" stroke="url(#goldCyan)" stroke-width="1.5" />
  <ellipse cx="400" cy="300" rx="40" ry="14" fill="#1e294c" stroke="url(#goldCyan)" stroke-width="1.5" />
  <!-- Bottle Cap -->
  <rect x="382" y="150" width="36" height="40" rx="4" fill="#a855f7" />

  <!-- Bottle Label -->
  <rect x="368" y="215" width="64" height="60" rx="4" fill="#141c38" />
  <circle cx="400" cy="235" r="10" fill="#00d2ff" />
  <rect x="380" y="255" width="40" height="5" rx="2" fill="#e2e8f0" />
  <rect x="385" y="264" width="30" height="4" rx="2" fill="#64748b" />
</svg>
