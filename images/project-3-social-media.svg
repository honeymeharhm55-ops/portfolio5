<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p3BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14193b" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>

    <linearGradient id="socialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <filter id="p3Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p3BgGrad)" />

  <!-- Background Glows -->
  <circle cx="150" cy="200" r="130" fill="#ec4899" opacity="0.18" />
  <circle cx="450" cy="180" r="140" fill="#00d2ff" opacity="0.18" />

  <!-- 3D Carousel Stack of Social Posts -->
  <!-- Left Slide (Tilted) -->
  <g transform="translate(60, 80) rotate(-10)" opacity="0.6" filter="url(#p3Shadow)">
    <rect width="210" height="260" rx="14" fill="#1b2345" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="105" cy="100" r="40" fill="#38bdf8" opacity="0.3" />
    <rect x="25" y="160" width="160" height="10" rx="3" fill="#cbd5e1" />
    <rect x="25" y="180" width="100" height="8" rx="3" fill="#64748b" />
  </g>

  <!-- Right Slide (Tilted) -->
  <g transform="translate(330, 80) rotate(10)" opacity="0.65" filter="url(#p3Shadow)">
    <rect width="210" height="260" rx="14" fill="#1b2345" stroke="#00d2ff" stroke-width="1.5" />
    <circle cx="105" cy="100" r="40" fill="#ec4899" opacity="0.3" />
    <rect x="25" y="160" width="160" height="10" rx="3" fill="#cbd5e1" />
    <rect x="25" y="180" width="100" height="8" rx="3" fill="#64748b" />
  </g>

  <!-- Featured Center Slide -->
  <g transform="translate(190, 60)" filter="url(#p3Shadow)">
    <rect width="220" height="280" rx="16" fill="#101732" stroke="url(#socialGrad)" stroke-width="2.5" />

    <!-- Post Header -->
    <circle cx="35" cy="30" r="14" fill="url(#socialGrad)" />
    <text x="60" y="28" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#ffffff">@khuram.designs</text>
    <text x="60" y="40" font-family="'Poppins', sans-serif" font-size="8" font-weight="500" fill="#94a3b8">Creative Studio</text>
    <circle cx="195" cy="30" r="2.5" fill="#94a3b8" />
    <circle cx="203" cy="30" r="2.5" fill="#94a3b8" />

    <!-- Main Visual Content Area -->
    <rect x="15" y="55" width="190" height="150" rx="10" fill="#172248" />
    <!-- Gradient Art in Post -->
    <path d="M15 150 Q 80 80, 150 140 T 205 90 L205 205 L15 205 Z" fill="url(#socialGrad)" opacity="0.8" />
    <text x="110" y="105" font-family="'Poppins', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">NEW DROP</text>
    <rect x="65" y="118" width="90" height="22" rx="11" fill="#ffffff" />
    <text x="110" y="133" font-family="'Poppins', sans-serif" font-size="9" font-weight="800" fill="#0f172a" text-anchor="middle">SWIPE &rarr;</text>

    <!-- Engagement Icons -->
    <g transform="translate(18, 220)">
      <circle cx="10" cy="10" r="9" fill="#ec4899" />
      <circle cx="35" cy="10" r="9" fill="#38bdf8" />
      <circle cx="60" cy="10" r="9" fill="#8b5cf6" />
      <text x="90" y="15" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">14.8K Likes</text>
    </g>

    <text x="18" y="255" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#ffffff">Social Campaign Suite</text>
    <text x="18" y="268" font-family="'Poppins', sans-serif" font-size="8" font-weight="400" fill="#64748b">#graphicdesign #branding #art</text>
  </g>

  <!-- Badge Top Left -->
  <rect x="25" y="25" width="195" height="30" rx="15" fill="rgba(19, 27, 52, 0.85)" stroke="url(#socialGrad)" stroke-width="1" />
  <text x="122" y="44" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">PROJECT 03: SOCIAL MEDIA</text>
</svg>
