<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c3a" />
      <stop offset="100%" stop-color="#0a0e1e" />
    </linearGradient>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#p1Bg)" />
  
  <!-- Subtle Grid Pattern -->
  <line x1="0" y1="100" x2="600" y2="100" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="0" y1="200" x2="600" y2="200" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="0" y1="300" x2="600" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="150" y1="0" x2="150" y2="400" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="300" y1="0" x2="300" y2="400" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="450" y1="0" x2="450" y2="400" stroke="rgba(255,255,255,0.04)" stroke-width="1" />

  <!-- Logo Mark Mockup Card -->
  <rect x="180" y="70" width="240" height="200" rx="16" fill="#1b254b" stroke="url(#p1Grad)" stroke-width="2" />
  <!-- Geometric Logo Icon -->
  <polygon points="300,105 350,195 250,195" fill="none" stroke="url(#p1Grad)" stroke-width="8" stroke-linejoin="round" />
  <circle cx="300" cy="165" r="16" fill="#00d2ff" />
  <text x="300" y="240" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="3">NEXUS BRAND</text>

  <!-- Color Swatches Bar -->
  <rect x="140" y="300" width="60" height="45" rx="8" fill="#8b5cf6" />
  <rect x="220" y="300" width="60" height="45" rx="8" fill="#3b82f6" />
  <rect x="300" y="300" width="60" height="45" rx="8" fill="#00d2ff" />
  <rect x="380" y="300" width="60" height="45" rx="8" fill="#10b981" />

  <!-- Ambient Glow -->
  <circle cx="300" cy="160" r="100" fill="#8b5cf6" opacity="0.15" />
</svg>
