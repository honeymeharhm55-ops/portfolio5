<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121834" />
      <stop offset="100%" stop-color="#070914" />
    </linearGradient>
    <linearGradient id="instaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#p3Bg)" />

  <!-- Social Post Cards Stack -->
  <!-- Back Card (Tilted) -->
  <rect x="140" y="70" width="220" height="260" rx="16" fill="#1b2446" stroke="#8b5cf6" stroke-width="1.5" transform="rotate(-8 250 200)" opacity="0.6" />

  <!-- Middle Card (Tilted opposite) -->
  <rect x="250" y="70" width="220" height="260" rx="16" fill="#1b2446" stroke="#00d2ff" stroke-width="1.5" transform="rotate(6 360 200)" opacity="0.75" />

  <!-- Front Featured Social Card -->
  <rect x="190" y="65" width="220" height="270" rx="16" fill="#151d3b" stroke="url(#instaGrad)" stroke-width="2.5" />
  
  <!-- Post Profile Header -->
  <circle cx="225" cy="98" r="15" fill="url(#instaGrad)" />
  <rect x="250" y="92" width="80" height="8" rx="2" fill="#ffffff" />
  <rect x="250" y="104" width="50" height="6" rx="2" fill="#64748b" />

  <!-- Post Image Area -->
  <rect x="205" y="125" width="190" height="135" rx="10" fill="#202b54" />
  <circle cx="300" cy="180" r="45" fill="url(#instaGrad)" opacity="0.7" />
  <text x="300" y="186" font-family="'Poppins', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">CREATIVE POST</text>

  <!-- Engagement Icons (Heart, Comment, Share) -->
  <circle cx="225" cy="285" r="9" fill="#ec4899" />
  <circle cx="250" cy="285" r="9" fill="#38bdf8" />
  <circle cx="275" cy="285" r="9" fill="#a855f7" />
  <rect x="220" y="306" width="140" height="7" rx="3" fill="#94a3b8" />
</svg>
