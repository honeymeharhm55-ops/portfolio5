<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p4BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c3e" />
      <stop offset="60%" stop-color="#0d132a" />
      <stop offset="100%" stop-color="#050712" />
    </linearGradient>

    <linearGradient id="adNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="podiumGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0" />
    </radialGradient>

    <filter id="p4Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p4BgGrad)" />

  <!-- Background Spotlight -->
  <circle cx="300" cy="180" r="160" fill="url(#podiumGlow)" />

  <!-- Pedestal 3D Base -->
  <ellipse cx="300" cy="320" rx="190" ry="32" fill="#111936" stroke="url(#adNeon)" stroke-width="2" />
  <ellipse cx="300" cy="320" rx="140" ry="20" fill="#18234c" />
  <ellipse cx="300" cy="320" rx="80" ry="10" fill="#202e62" />

  <!-- Modern Luxury Product (Audio Pro Wireless Headphones) -->
  <g transform="translate(300, 190)">
    <!-- Headband Arch -->
    <path d="M-80 0 C-80 -100, 80 -100, 80 0" fill="none" stroke="url(#adNeon)" stroke-width="14" stroke-linecap="round" filter="url(#p4Glow)" />
    <path d="M-70 -20 C-70 -85, 70 -85, 70 -20" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" opacity="0.6" />

    <!-- Earcups Left & Right -->
    <g transform="translate(-80, 0)">
      <rect x="-18" y="-10" width="36" height="70" rx="18" fill="#1e294b" stroke="#38bdf8" stroke-width="3" />
      <rect x="-12" y="5" width="24" height="40" rx="10" fill="#0c1224" />
      <circle cx="0" cy="25" r="8" fill="#a855f7" />
    </g>

    <g transform="translate(80, 0)">
      <rect x="-18" y="-10" width="36" height="70" rx="18" fill="#1e294b" stroke="#38bdf8" stroke-width="3" />
      <rect x="-12" y="5" width="24" height="40" rx="10" fill="#0c1224" />
      <circle cx="0" cy="25" r="8" fill="#a855f7" />
    </g>

    <!-- Floating Soundwave Particles -->
    <circle cx="-130" cy="-20" r="4" fill="#00d2ff" filter="url(#p4Glow)" />
    <circle cx="-110" cy="30" r="6" fill="#a855f7" filter="url(#p4Glow)" />
    <circle cx="120" cy="-30" r="5" fill="#a855f7" filter="url(#p4Glow)" />
    <circle cx="140" cy="25" r="4" fill="#00d2ff" filter="url(#p4Glow)" />
  </g>

  <!-- High-Impact Commercial Headlines -->
  <text x="300" y="75" font-family="'Poppins', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">SONIC PULSE PRO</text>
  <text x="300" y="100" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="3">ZERO NOISE • PURE STUDIO FIDELITY</text>

  <!-- CTA Commercial Button -->
  <rect x="230" y="348" width="140" height="32" rx="16" fill="url(#adNeon)" />
  <text x="300" y="369" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">PRE-ORDER NOW</text>

  <!-- Badge Top Left -->
  <rect x="25" y="25" width="200" height="30" rx="15" fill="rgba(19, 27, 52, 0.85)" stroke="url(#adNeon)" stroke-width="1" />
  <text x="125" y="44" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">PROJECT 04: ADVERTISING</text>
</svg>
