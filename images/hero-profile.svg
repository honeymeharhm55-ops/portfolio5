<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="heroBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#182348" />
      <stop offset="60%" stop-color="#0c1228" />
      <stop offset="100%" stop-color="#060914" />
    </radialGradient>

    <!-- Neon Glows -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Clip Path -->
  <clipPath id="circleClip">
    <circle cx="250" cy="250" r="245" />
  </clipPath>

  <g clip-path="url(#circleClip)">
    <!-- Deep Space Background -->
    <rect width="500" height="500" fill="url(#heroBg)" />

    <!-- Ambient Glowing Orbs -->
    <circle cx="160" cy="180" r="140" fill="#8b5cf6" opacity="0.3" filter="url(#glowEffect)" />
    <circle cx="350" cy="280" r="130" fill="#00d2ff" opacity="0.25" filter="url(#glowEffect)" />

    <!-- Digital Grid Motif -->
    <path d="M50 150 L450 150 M50 250 L450 250 M50 350 L450 350 M150 50 L150 450 M250 50 L250 450 M350 50 L350 450" stroke="rgba(139, 92, 246, 0.08)" stroke-width="1.5" />

    <!-- Professional Designer Silhouette Avatar -->
    <!-- Torso / Shoulders with Modern Suit Jacket -->
    <path d="M100 480 C110 380, 160 340, 250 340 C340 340, 390 380, 400 480 Z" fill="#151d3b" stroke="url(#purpleGrad)" stroke-width="3" />
    <!-- Inner Shirt & Tie/Lapel -->
    <polygon points="250,340 215,480 285,480" fill="#0f152d" />
    <polygon points="250,360 238,480 262,480" fill="#38bdf8" opacity="0.8" />
    <polygon points="250,380 244,480 256,480" fill="#8b5cf6" />

    <!-- Neck -->
    <rect x="226" y="260" width="48" height="90" rx="8" fill="#24325e" />

    <!-- Head / Face -->
    <ellipse cx="250" cy="210" rx="72" ry="86" fill="#1b254a" stroke="url(#cyanGrad)" stroke-width="2.5" />

    <!-- Creative Designer Hair -->
    <path d="M178 185 C175 110, 325 110, 322 185 C320 150, 295 130, 250 130 C205 130, 180 150, 178 185 Z" fill="url(#purpleGrad)" />

    <!-- Modern Smart Glasses -->
    <rect x="198" y="194" width="44" height="28" rx="8" fill="none" stroke="#00d2ff" stroke-width="3.5" filter="url(#glowEffect)" />
    <rect x="258" y="194" width="44" height="28" rx="8" fill="none" stroke="#00d2ff" stroke-width="3.5" filter="url(#glowEffect)" />
    <line x1="242" y1="208" x2="258" y2="208" stroke="#00d2ff" stroke-width="3.5" />

    <!-- High-End Audio Headset -->
    <path d="M164 210 C164 125, 336 125, 336 210" fill="none" stroke="url(#purpleGrad)" stroke-width="7" stroke-linecap="round" />
    <rect x="154" y="195" width="20" height="42" rx="9" fill="#8b5cf6" filter="url(#glowEffect)" />
    <rect x="326" y="195" width="20" height="42" rx="9" fill="#8b5cf6" filter="url(#glowEffect)" />

    <!-- Digital Pen Stylus in Hand -->
    <g transform="translate(310, 340) rotate(-35)">
      <rect x="0" y="0" width="16" height="110" rx="6" fill="#1e294b" stroke="#00d2ff" stroke-width="2" />
      <polygon points="0,0 16,0 8,-25" fill="#38bdf8" filter="url(#glowEffect)" />
      <rect x="3" y="30" width="10" height="20" rx="3" fill="#a855f7" />
    </g>

    <!-- Professional Badge Banner -->
    <rect x="110" y="420" width="280" height="42" rx="21" fill="rgba(7, 9, 19, 0.9)" stroke="url(#cyanGrad)" stroke-width="1.5" filter="url(#glowEffect)" />
    <text x="250" y="446" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">
      KHURAM LATIF <tspan fill="#00d2ff">•</tspan> DESIGNER
    </text>
  </g>

  <!-- Circular Outer Glowing Ring -->
  <circle cx="250" cy="250" r="246" fill="none" stroke="url(#purpleGrad)" stroke-width="6" />
</svg>
