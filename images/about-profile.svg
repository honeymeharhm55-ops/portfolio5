<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="aboutRad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#162045" />
      <stop offset="65%" stop-color="#0c1228" />
      <stop offset="100%" stop-color="#060914" />
    </radialGradient>
    <linearGradient id="purpleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <filter id="glowAbout" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <clipPath id="aboutClip">
    <circle cx="250" cy="250" r="245" />
  </clipPath>

  <g clip-path="url(#aboutClip)">
    <!-- Background -->
    <rect width="500" height="500" fill="url(#aboutRad)" />

    <!-- Ambient Studio Lights -->
    <circle cx="120" cy="150" r="130" fill="#8b5cf6" opacity="0.3" filter="url(#glowAbout)" />
    <circle cx="380" cy="200" r="140" fill="#00d2ff" opacity="0.25" filter="url(#glowAbout)" />

    <!-- Studio Desk Silhouette & Workspace Setup -->
    <rect x="70" y="320" width="360" height="180" rx="14" fill="#131b38" stroke="url(#purpleBlue)" stroke-width="2" />
    <!-- Drawing Tablet Screen -->
    <rect x="110" y="340" width="280" height="150" rx="8" fill="#0a0f22" />
    <!-- Visual Design Lines on Tablet -->
    <path d="M140 420 Q 250 360, 360 410" fill="none" stroke="#00d2ff" stroke-width="3" />
    <polygon points="250,380 280,430 220,430" fill="none" stroke="#a855f7" stroke-width="3" />

    <!-- Designer Portrait Torso -->
    <path d="M140 370 C140 290, 180 250, 250 250 C320 250, 360 290, 360 370 Z" fill="#1c274e" stroke="url(#purpleBlue)" stroke-width="2.5" />
    <rect x="230" y="195" width="40" height="65" rx="6" fill="#24325e" />

    <!-- Head -->
    <ellipse cx="250" cy="155" rx="62" ry="74" fill="#1c274e" stroke="#00d2ff" stroke-width="2" />
    <!-- Hair -->
    <path d="M190 140 C190 75, 310 75, 310 140 C305 110, 280 95, 250 95 C220 95, 195 110, 190 140 Z" fill="url(#purpleBlue)" />

    <!-- Glasses -->
    <rect x="208" y="145" width="36" height="22" rx="6" fill="none" stroke="#00d2ff" stroke-width="3" filter="url(#glowAbout)" />
    <rect x="256" y="145" width="36" height="22" rx="6" fill="none" stroke="#00d2ff" stroke-width="3" filter="url(#glowAbout)" />
    <line x1="244" y1="156" x2="256" y2="156" stroke="#00d2ff" stroke-width="3" />

    <!-- Creative Tool Emblems (Ps and Ai) Floating Badges -->
    <g transform="translate(70, 180)">
      <rect width="44" height="44" rx="10" fill="#0c1836" stroke="#38bdf8" stroke-width="2" filter="url(#glowAbout)" />
      <text x="22" y="28" font-family="'Poppins', sans-serif" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle">Ps</text>
    </g>

    <g transform="translate(386, 180)">
      <rect width="44" height="44" rx="10" fill="#331806" stroke="#f59e0b" stroke-width="2" filter="url(#glowAbout)" />
      <text x="22" y="28" font-family="'Poppins', sans-serif" font-size="18" font-weight="900" fill="#f59e0b" text-anchor="middle">Ai</text>
    </g>

    <!-- Professional Caption Tag -->
    <rect x="130" y="445" width="240" height="34" rx="17" fill="rgba(6, 9, 20, 0.95)" stroke="url(#purpleBlue)" stroke-width="1.5" />
    <text x="250" y="467" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      KHURAM LATIF • STUDIO
    </text>
  </g>

  <!-- Circular Outer Glowing Ring -->
  <circle cx="250" cy="250" r="246" fill="none" stroke="url(#purpleBlue)" stroke-width="6" />
</svg>
