<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p1BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c3c" />
      <stop offset="50%" stop-color="#0e152e" />
      <stop offset="100%" stop-color="#070a16" />
    </linearGradient>

    <linearGradient id="logoNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <filter id="p1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="400" fill="url(#p1BgGrad)" />

  <!-- Illustrator Vector Construction Grid -->
  <g stroke="rgba(139, 92, 246, 0.12)" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <!-- Golden Ratio Compass Circles -->
    <circle cx="300" cy="175" r="110" fill="none" stroke-dasharray="4 4" />
    <circle cx="300" cy="175" r="75" fill="none" stroke-dasharray="3 3" />
    <circle cx="300" cy="175" r="45" fill="none" />
  </g>

  <!-- Ambient Color Glows -->
  <circle cx="300" cy="175" r="90" fill="#8b5cf6" opacity="0.25" filter="url(#p1Glow)" />
  <circle cx="240" cy="140" r="60" fill="#00d2ff" opacity="0.2" filter="url(#p1Glow)" />

  <!-- The Geometric Logo Symbol -->
  <g transform="translate(300, 175)">
    <!-- Outer Interlocking Ribbon 1 -->
    <path d="M-65 -45 C-10 -90, 70 -70, 75 0 C80 60, 20 80, -35 65" fill="none" stroke="url(#logoNeon)" stroke-width="14" stroke-linecap="round" filter="url(#p1Glow)" />
    <!-- Inner Interlocking Ribbon 2 -->
    <path d="M65 45 C10 90, -70 70, -75 0 C-80 -60, -20 -80, 35 -65" fill="none" stroke="#00d2ff" stroke-width="14" stroke-linecap="round" />
    <!-- Center Core Crystal -->
    <polygon points="0,-25 22,12 -22,12" fill="#f8fafc" opacity="0.95" />
    
    <!-- Vector Anchor Points (Ai Aesthetic) -->
    <rect x="-70" y="-50" width="10" height="10" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <rect x="70" y="-5" width="10" height="10" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <rect x="-40" y="60" width="10" height="10" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Typographic Specimen -->
  <text x="300" y="315" font-family="'Poppins', sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="6">AURA STUDIOS</text>
  <text x="300" y="338" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">PRECISION VECTOR IDENTITY</text>

  <!-- Project Badge Top Left -->
  <rect x="25" y="25" width="145" height="30" rx="15" fill="rgba(19, 27, 52, 0.85)" stroke="url(#logoNeon)" stroke-width="1" />
  <text x="97" y="44" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">PROJECT 01: LOGO</text>

  <!-- Color Palette Swatches Bottom Right -->
  <g transform="translate(435, 345)">
    <circle cx="15" cy="15" r="10" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="42" cy="15" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="69" cy="15" r="10" fill="#00d2ff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="96" cy="15" r="10" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="123" cy="15" r="10" fill="#f8fafc" stroke="#ffffff" stroke-width="1.5" />
  </g>
</svg>
